apply plugin: 'com.android.application'

android {
    namespace 'com.huoyu.livesub'
    compileSdk 34

    defaultConfig {
        applicationId "com.huoyu.livesub"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 无需第三方依赖：WebView / WindowManager / org.json 均为系统内置
}
